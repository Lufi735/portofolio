<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="sketchBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#sketchBg)"/>

  <!-- Blueprint & Construction Grids -->
  <g stroke="rgba(245,158,11,0.12)" stroke-width="1">
    <circle cx="400" cy="400" r="320" fill="none"/>
    <circle cx="400" cy="400" r="220" fill="none" stroke-dasharray="4,6"/>
    <line x1="80" y1="400" x2="720" y2="400"/>
    <line x1="400" y1="80" x2="400" y2="720"/>
    <line x1="170" y1="170" x2="630" y2="630" stroke-dasharray="2,6"/>
    <line x1="630" y1="170" x2="170" y2="630" stroke-dasharray="2,6"/>
  </g>

  <!-- Gesture Arcs & Motion Lines -->
  <path d="M220 580 Q400 240 580 320" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8,5" opacity="0.6"/>
  <path d="M260 640 Q420 380 620 400" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>

  <!-- Anatomical Construction Mannequin (Dynamic Jumping / Slashing Pose) -->
  <!-- Head & Cranium -->
  <circle cx="400" cy="220" r="50" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <ellipse cx="400" cy="225" rx="36" ry="46" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="400" y1="170" x2="400" y2="270" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="365" y1="225" x2="435" y2="225" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Spine Line & Ribcage -->
  <path d="M400 270 Q420 330 390 410" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <ellipse cx="405" cy="330" rx="70" ry="55" fill="none" stroke="#f59e0b" stroke-width="2" transform="rotate(-8 405 330)"/>

  <!-- Pelvis Box -->
  <polygon points="350,420 440,405 450,470 340,480" fill="none" stroke="#fbbf24" stroke-width="2.2"/>

  <!-- Left Arm (Reaching forward) -->
  <line x1="340" y1="310" x2="260" y2="360" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="260" cy="360" r="8" fill="#f59e0b" opacity="0.4"/>
  <line x1="260" y1="360" x2="190" y2="440" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Hand / Grip -->
  <circle cx="190" cy="440" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/>

  <!-- Right Arm (Raised wielding weapon) -->
  <line x1="470" y1="300" x2="550" y2="250" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="550" cy="250" r="8" fill="#f59e0b" opacity="0.4"/>
  <line x1="550" y1="250" x2="620" y2="180" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Blade Sketched -->
  <line x1="620" y1="180" x2="730" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="620" y1="180" x2="580" y2="220" stroke="#ffffff" stroke-width="3"/>

  <!-- Legs & Dynamic Footing -->
  <!-- Left Leg (Bent knee drive) -->
  <line x1="360" y1="480" x2="280" y2="560" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="280" cy="560" r="9" fill="#f59e0b" opacity="0.4"/>
  <line x1="280" y1="560" x2="310" y2="670" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Leg (Trailing extension) -->
  <line x1="430" y1="460" x2="520" y2="540" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="520" cy="540" r="9" fill="#f59e0b" opacity="0.4"/>
  <line x1="520" y1="540" x2="590" y2="640" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Artist Cross-hatching Accents -->
  <g stroke="rgba(251,191,36,0.35)" stroke-width="1.2">
    <line x1="380" y1="310" x2="410" y2="340"/>
    <line x1="385" y1="305" x2="415" y2="335"/>
    <line x1="390" y1="300" x2="420" y2="330"/>
    <line x1="345" y1="430" x2="375" y2="460"/>
    <line x1="350" y1="425" x2="380" y2="455"/>
  </g>
</svg>