<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="aura1" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="rgba(244,63,94,0.35)"/>
      <stop offset="70%" stop-color="rgba(244,63,94,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cloakGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad1)"/>
  
  <!-- Aura & Celestial Ring -->
  <circle cx="400" cy="380" r="300" fill="url(#aura1)"/>
  <circle cx="400" cy="380" r="220" fill="none" stroke="rgba(251,113,133,0.18)" stroke-width="2" stroke-dasharray="6,8"/>
  <circle cx="400" cy="380" r="160" fill="none" stroke="rgba(251,113,133,0.3)" stroke-width="1.5"/>

  <!-- Dynamic Energy Slash / Arc -->
  <path d="M180 620 C220 340 450 180 640 220 C520 280 340 400 260 640 Z" fill="url(#bladeGrad)" filter="url(#glow1)" opacity="0.85"/>

  <!-- Character Figure / Silhouette -->
  <!-- Floating Scarf / Cape Tails -->
  <path d="M380 320 C300 350 220 440 160 540 C220 480 310 420 370 380 Z" fill="url(#bladeGrad)" opacity="0.6"/>
  <path d="M420 320 C480 380 560 480 620 580 C550 510 470 430 410 370 Z" fill="#4338ca" opacity="0.5"/>

  <!-- Body / Trenchcoat -->
  <path d="M360 280 L440 280 L490 560 L420 540 L400 660 L380 540 L310 560 Z" fill="url(#cloakGrad)"/>
  
  <!-- Hood / Head -->
  <path d="M375 220 C375 180 425 180 425 220 L435 280 L365 280 Z" fill="#0f172a"/>
  <!-- Glowing Eye / Visor -->
  <path d="M390 232 L420 236 L405 240 Z" fill="#38bdf8" filter="url(#glow1)"/>
  <circle cx="405" cy="236" r="3" fill="#ffffff" filter="url(#glow1)"/>

  <!-- Katana / Scythe Handle & Blade -->
  <line x1="280" y1="580" x2="560" y2="180" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="580" x2="560" y2="180" stroke="#fb7185" stroke-width="8" filter="url(#glow1)" opacity="0.5"/>

  <!-- Floating Embers -->
  <circle cx="280" cy="300" r="3" fill="#fb7185" filter="url(#glow1)"/>
  <circle cx="520" cy="260" r="4" fill="#fb7185" filter="url(#glow1)"/>
  <circle cx="340" cy="460" r="2.5" fill="#38bdf8" filter="url(#glow1)"/>
  <circle cx="480" cy="490" r="3.5" fill="#f43f5e" filter="url(#glow1)"/>
  <circle cx="220" cy="420" r="2" fill="#ffffff"/>
  <circle cx="580" cy="390" r="2" fill="#ffffff"/>
</svg>